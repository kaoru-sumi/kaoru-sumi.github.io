  sections:
    Research Profile:
      - "Researcher in affective computing and human-AI interaction, with research spanning persuasive technology, human-agent and human-robot interaction, embodied AI, VR/MR/XR, nonverbal communication, serious games, and affective learning. Current work focuses on socially embodied AI that can understand human affect and behavior, adapt its nonverbal and verbal behavior, and support learning, behavior change, communication, and social connection."

    Research Areas:
      - label: Areas
        details: Affective Computing; Human-AI Interaction; Human-Agent Interaction; Human-Robot Interaction; Persuasive Technology; Embodied AI and Social Agents; VR/MR/XR; Serious Games and Affective Learning; Nonverbal and Multimodal Interaction; Physiological Sensing

