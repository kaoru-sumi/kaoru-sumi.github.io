# Test-only overrides; use test/prepare_demo_site.sh to stage the source.
permalink: /blog/:year/:title/
posts_in_search: true
blog_name: al-folio
blog_description: a simple whitespace theme for academics
pagination:
  enabled: true
related_blog_posts:
  enabled: true
  max_related: 5
disqus_shortname: al-folio
collections:
  books:
    output: true
  teachings:
    output: true
repo_theme_light: default
repo_theme_dark: dark
repo_trophies:
  enabled: true
  theme_light: flat
  theme_dark: gitdimmed
external_services:
  github_readme_stats_url: https://github-stats-extended.vercel.app
  github_profile_trophy_url: https://github-profile-trophy.vercel.app
