name: Research site browser checks

on:
  pull_request:
    branches: [main, master, v1.0-dev]
    paths:
      - "_config.yml"
      - "_data/**"
      - "_bibliography/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "_news/**"
      - "_plugins/**"
      - "_includes/**"
      - "_layouts/**"
      - "_sass/**"
      - "assets/**"
      - "test/visual/**"
      - ".github/workflows/visual-regression.yml"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"
  push:
    branches: [main, master, v1.0-dev]
    paths:
      - "_config.yml"
      - "_data/**"
      - "_bibliography/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "_news/**"
      - "_plugins/**"
      - "_includes/**"
      - "_layouts/**"
      - "_sass/**"
      - "assets/**"
      - "test/visual/**"
      - ".github/workflows/visual-regression.yml"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Install image runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production-site browser checks
        env:
          JEKYLL_ENV: production
        run: |
          set -o pipefail
          npm run test:visual 2>&1 | tee /tmp/jekyll-site-browser.log

      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-browser-report
          path: |
            output/playwright/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload selected review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-review-screenshots
          path: output/site-review/*.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload build and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-browser-log
          path: /tmp/jekyll-site-browser.log
          retention-days: 14
          if-no-files-found: ignore
