name: Prettier code formatter

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install locked dependencies 💾
        run: npm ci
      - name: Prettier Check 🔎
        id: prettier
        run: npx prettier . --check
      - name: Create diff 📝
        # https://docs.github.com/en/actions/learn-github-actions/expressions#failure
        if: ${{ failure() }}
        run: |
          npx prettier . --write
          git diff -- . ':(exclude)package-lock.json' ':(exclude)package.json' > diff.txt
          npm install -g diff2html-cli
          diff2html -i file -s side -F diff.html -- diff.txt
      - name: Upload html diff ⬆️
        id: artifact-upload
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: HTML Diff
          path: diff.html
          retention-days: 7
      - name: Report formatting failure
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        env:
          ARTIFACT_URL: ${{ steps.artifact-upload.outputs.artifact-url }}
        run: |
          echo '## Formatting needs attention' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run `npm ci` and `npm run lint:prettier` locally. The HTML Diff artifact shows the required changes.' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[Download the formatting diff](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
