name: One-time Prettier format fix

on:
  push:
    branches:
      - prettier-format-fix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prettier-format-fix
      - uses: actions/setup-node@v4
      - name: Install Prettier
        run: npm install --save-dev --save-exact prettier @shopify/prettier-plugin-liquid
      - name: Format only
        run: |
          npx prettier . --write
          git checkout -- package.json package-lock.json
          rm .github/workflows/prettier-one-time.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Prettier formatting only" || exit 0
          git push origin prettier-format-fix
