name: Axe accessibility testing

on:
  pull_request:
    branches: [main, master]
    paths:
      - "_pages/**"
      - "_data/**"
      - "_news/**"
      - "_posts/**"
      - "_projects/**"
      - "_books/**"
      - "_teachings/**"
      - "_bibliography/**"
      - "_plugins/**"
      - "_layouts/**"
      - "_includes/**"
      - "_sass/**"
      - "assets/**"
      - "*.html"
      - "*.md"
      - "_config*.yml"
      - "Gemfile*"
      - "package*.json"
      - "purgecss.config.js"
      - ".github/workflows/axe.yml"
  workflow_dispatch:
    inputs:
      url:
        description: "Local page path to check (e.g. blog/); blank checks the four main English/Japanese pages"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: axe-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.pages.outputs.pages }}
    steps:
      - name: Select pages
        id: pages
        env:
          REQUESTED_PATH: ${{ inputs.url }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          requested = os.environ["REQUESTED_PATH"].strip()
          pages = ["/", "/ja/", "/lab/", "/ja/lab/"]
          if requested:
              if ":" in requested or "?" in requested or "#" in requested or "\\" in requested or ".." in requested.split("/"):
                  raise SystemExit("Enter a local page path, such as blog/ or /ja/lab/.")
              pages = ["/" + requested.lstrip("/")]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("pages=" + json.dumps(pages) + "\n")
          PYTHON
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Share the built site
        uses: actions/upload-artifact@v4
        with:
          name: axe-site
          path: _site/
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        page: ${{ fromJSON(needs.build.outputs.pages) }}
    name: Axe (${{ matrix.page }})
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: axe-site
          path: _site
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install Axe
        run: npm install -g @axe-core/cli@4.10.2
      - name: Run Axe
        env:
          PAGE_PATH: ${{ matrix.page }}
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory _site > /tmp/axe-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          # Fail on missing pages instead of auditing a server's 404 response.
          curl --fail --silent "http://127.0.0.1:8080$PAGE_PATH" > /dev/null
          axe --chrome-path "$CHROME_PATH" --chromedriver-path "$CHROMEDRIVER_PATH" \
            "http://127.0.0.1:8080$PAGE_PATH" --chrome-options="--headless,--no-sandbox" --load-delay=1500 --exit
      - name: Verify missing alt is rejected
        if: ${{ !cancelled() && matrix.page == '/' && steps.chrome.outcome == 'success' }}
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}
        run: |
          fixture=$(mktemp -d)
          trap 'kill "$server_pid"; rm -rf "$fixture"' EXIT
          printf '%s' '<!doctype html><html lang="en"><title>Axe regression fixture</title><main><img src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22%3E%3C/svg%3E"></main></html>' > "$fixture/index.html"
          python3 -m http.server 8081 --bind 127.0.0.1 --directory "$fixture" > /tmp/axe-fixture.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8081/ > /dev/null
          status=0
          axe --chrome-path "$CHROME_PATH" --chromedriver-path "$CHROMEDRIVER_PATH" \
            http://127.0.0.1:8081/ --chrome-options="--headless,--no-sandbox" --rules image-alt --exit > /tmp/axe-negative.log 2>&1 || status=$?
          cat /tmp/axe-negative.log
          test "$status" -eq 1
          grep -q 'image-alt' /tmp/axe-negative.log
